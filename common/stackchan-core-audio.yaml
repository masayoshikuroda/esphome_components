external_components:
  - source:
      type: git
      url: http://github.com/m5stack/esphome-yaml
      ref: main
    components: [aw88298]
    refresh: 1d

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 32bit
    sample_rate: 16000
    mic_gain: 36

audio_dac:
  - platform: aw88298
    id: aw88298_dac
    i2c_id: bsp_bus
    sample_rate: 16000

i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO34
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true
#  full_duplex: true

microphone:
  - platform: i2s_audio
    id: microphone_internal
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_audio_id: i2s_audio_bus

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: speaker_internal
    dac_type: external
    i2s_dout_pin: GPIO13
    audio_dac: aw88298_dac
    sample_rate: 16000
    bits_per_sample: 16bit
#    bits_per_sample: 32bit

media_player:
  - platform: speaker
    name: " Internal Media Player"
    id: media_player_internal
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: speaker_internal
      format: FLAC
      sample_rate: 16000
      num_channels: 1
