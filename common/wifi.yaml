wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${node_key} Fallback Hotspot"
    password: !secret wifi_ap_password

ota:
  - platform: esphome
    password: !secret ota_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp
    id: sntp_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "TEXT IP Address"
      id: text_ip_address
    mac_address:
      name: "TEXT MAC Address"
      id: text_mac_address
    ssid:
      name: "TEXT SSID"
      id: text_ssid
    bssid:
      name: "TEXT BSSID"
      id: text_bssid
    dns_address:
      name: "TEXT DNS Address"
      id: text_dns_address

sensor:
  - platform: uptime
    name: Sensor Uptime
  - platform: wifi_signal
    name: Sensor WiFi Signal
