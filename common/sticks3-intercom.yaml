external_components:
  - source: 
      type: git
      url: https://github.com/n-IA-hane/esphome-audio-stack
      path: /esphome
      ref: main
    components:
      - esp_audio_stack
      - esp_aec

esp_aec:
  id: aec
  sample_rate: 16000
  # fd_* adds the NLP residual suppression that the SR modes lack; without it the
  # wake word is unreliable while music plays.
  mode: fd_low_cost
  filter_length: 4

esp_audio_stack:
  id: audio_stack
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  # ES8311 feedback puts the mic on RX slot 0 and the DAC echo on slot 1, so the
  # bus must be read as stereo. Playback stays mono (speaker_channels defaults 1).
  num_channels: 2
  processor_id: aec
  use_stereo_aec_reference: true
  reference_channel: right
  buffers_in_psram: true
  audio_task_stack_in_psram: true
  telemetry: false

  i2s_mclk_pin: GPIO18
  i2s_bclk_pin: GPIO17
  i2s_lrclk_pin:
    number: GPIO15
    ignore_strapping_warning: true
  i2s_din_pin: GPIO16
  i2s_dout_pin: GPIO14

  codec:
    i2c_id: i2c_internal
    input:
      type: es8311
      address: 0x18
      # Keep ADC headroom for the speaker echo that leaks into the mic; the
      # post-AEC mic_gain restores the level, so the delivered audio is unchanged.
      gain_db: 12
      use_mclk: true
      no_dac_ref: false
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: false

  on_amplifier_required:
    then:
      - switch.turn_on: speaker_enable

  on_amplifier_idle:
    then:
      - switch.turn_off: speaker_enable

microphone:
  - platform: esp_audio_stack
    id: i2s_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: i2s_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s

  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    bits_per_sample: 16
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never    

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    bits_per_sample: 16
    sample_rate: 48000

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    bits_per_sample: 16
    sample_rate: 48000
