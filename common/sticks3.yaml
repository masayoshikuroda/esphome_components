esp32:
  board: m5stack-atoms3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/masayoshikuroda/esphome_components
      ref: main
    components: [ m5pm1 ]

psram:
  mode: octal
  speed: 80MHz

remote_transmitter:
  pin: 46
  carrier_duty_percent: 50%

spi:
  clk_pin: 40
  mosi_pin: 39

i2c:
  - id: i2c_internal
    sda: 47
    scl: 48
    scan: True
    frequency: 100kHz

m5pm1:
  id: m5pm1_id
  i2c_id: i2c_internal
  address: 0x6E

binary_sensor:
  - platform: template
    id: battery_charging
    name: Battery Charging
    lambda:
      return id(m5pm1_id).is_charging();

output:
  - platform: ledc
    id: output_backlight
    pin: GPIO38
    frequency: 1000Hz     # or try 5000Hz if still dim

light:
  - platform: monochromatic
    id: light_backlight
    output: output_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
