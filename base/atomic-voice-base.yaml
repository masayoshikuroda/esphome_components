i2c:
  - id: i2c_external
    sda: GPIO38
    scl: GPIO39

pi4ioe5v6408:
  - id: pi4ioe5v6408_hub
    i2c_id: i2c_external
    address: 0x43

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_external
    bits_per_sample: 32bit
    sample_rate: 16000
    use_microphone: false
    use_mclk: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO8
    full_duplex: false

microphone:
  - platform: i2s_audio
    id: microphone_internal
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO7
    adc_type: external
    pdm: false
    i2s_mode: primary
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left

speaker:
  - platform: i2s_audio
    id: speaker_internal
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO5
    dac_type: external
    audio_dac: es8311_dac
    i2s_mode: primary
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left
    buffer_duration: 1s
    timeout: 3s

media_player:
  - platform: speaker
    name: "Echo Base Player"
    id: echo_base_player
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: speaker_internal
      format: FLAC
      sample_rate: 48000
      num_channels: 1

switch:
  # NS4150B
  - platform: gpio
    name: Speaker Enable
    pin:
      pi4ioe5v6408: pi4ioe5v6408_hub
      number: 0
      mode:
        output: true
    icon: "mdi:volume-high"
    restore_mode: RESTORE_DEFAULT_ON




